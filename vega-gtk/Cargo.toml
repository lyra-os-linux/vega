[package]
name = "vega-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
homepage.workspace = true
description = "Interface do centro de controle Vega (Tauri)"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
vega-virtualization = { path = "../vega-virtualization" }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2.3.4"
tauri-plugin-dialog = "2.4.2"
gio = "0.22.8"
glib = { version = "0.22.8", features = ["v2_66"] }
base64 = "0.22.1"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
futures-util = "0.3.32"
async-io = "2.6.0"
async-lock = "3.4.2"
zbus = "5.17.0"
lyra-vega-dbus = { git = "https://github.com/lyra-os-linux/lyra-vega-dbus", rev = "207147dccabf34ec5c50876356c160b363a74054" }
