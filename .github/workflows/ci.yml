name: CI

on:
  # Stacked profile PRs need the same checks before their base reaches main.
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vega-gtk:
    name: vega-gtk (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies (GTK4, libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev pkg-config build-essential gettext locales xvfb xauth dbus-x11 \
            gnome-shell-common gsettings-desktop-schemas python3-gi
          # Match the UTF-8 locale names used by Vega and glibc-locale-base.
          for locale in en_US pt_BR es_ES; do
            sudo localedef -i "$locale" -f UTF-8 -c "$locale.UTF-8"
          done

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: Compatibilidade com a versão fixada de lyra-vega-dbus
        run: scripts/ci/check-lyra-vega-dbus-pin.sh

      - name: cargo clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

      - name: Verify desktop toggle without system GSettings schemas
        run: |
          schema_fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$schema_fixture_dir"' EXIT
          GSETTINGS_SCHEMA_DIR="$schema_fixture_dir" XDG_DATA_DIRS="$schema_fixture_dir" \
            cargo test --workspace --locked \
              dock::profile_tests::desktop_toggle_preserves_other_extensions_and_global_preference \
              -- --exact

      - name: Load the matching Sheliak profile schemas
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lyra-os-linux/lyraos-desktop-sheliak
          ref: 7503cdbbe93a5703182593580087ef34db5fb807
          path: fixtures/sheliak
      - name: Verify public profile command with isolated persistent settings
        run: |
          glib-compile-schemas fixtures/sheliak/schemas
          cargo build --workspace --locked
          python3 tests/profile-command.py --binary target/debug/vega-gtk --schemas fixtures/sheliak/schemas
          python3 tests/profile-command.py --binary target/debug/vega-gtk --schemas fixtures/sheliak/schemas --suite-helper fixtures/sheliak/packaging/lyra-shell-suite.py

      - name: Verify history deletion in real GTK with isolated user data
        run: xvfb-run -a dbus-run-session -- cargo test --workspace --locked native_history_ui -- --ignored --test-threads=1

      - name: Verify forms and required approvals with a private D-Bus fixture
        run: xvfb-run -a cargo test --workspace --locked native_dialog_flows -- --ignored --test-threads=1

      - name: Verify IPv4 retry and selection after backend completion
        run: xvfb-run -a cargo test --workspace --locked native_ipv4_retry -- --ignored --test-threads=1

      - name: Verify language selector persistence in real GTK
        run: |
          vega_preferences_test_dir="$(mktemp -d /tmp/lyra-feedback-25-preferences-XXXXXX)"
          trap 'rm -rf "$vega_preferences_test_dir"' EXIT
          XDG_CONFIG_HOME="$vega_preferences_test_dir" GTK_A11Y=none GSETTINGS_BACKEND=memory \
            xvfb-run -a dbus-run-session -- cargo test --workspace --locked \
            native_language_selection_persists_without_changing_other_settings \
            -- --ignored --test-threads=1

  translations:
    name: Inventário de traduções
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Testes de i18n e navegação dos ajustes GNOME
        run: python3 -m unittest discover -s tests -v
