name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: vegad · Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vegad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: vegad/go.mod
          cache-dependency-path: vegad/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  rust:
    name: Rust · contratos e Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y libpam0g-dev gettext
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p lyra-vega-dbus -p vega-web --all-targets -- -D warnings
      - run: cargo test --locked -p lyra-vega-dbus -p vega-web

  static:
    name: Shell, XML, i18n e empacotamento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y libxml2-utils rpm systemd shellcheck gettext
      - run: bash -n vega-cli/bin/vega vega-cli/lib/*.sh scripts/*.sh packaging/opensuse/*.sh
      - run: shellcheck --severity=error vega-cli/bin/vega vega-cli/lib/*.sh scripts/qa-packaging.sh scripts/test-dbus-integration.sh
      - run: python3 -m unittest discover -s tests
      - run: xmllint --noout dbus/*.xml packaging/vegad/org.lyraos.Vega1.conf packaging/vegad/org.lyraos.vega.policy
      - run: rpmspec -P packaging/opensuse/vegad.spec >/dev/null
      - run: rpmspec -P packaging/obs/vegad.spec >/dev/null
