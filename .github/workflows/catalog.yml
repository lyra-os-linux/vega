name: Catálogo do Software

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Conferir os catálogos na rede
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set +e
          python3 scripts/check-catalog.py --remote --markdown report.md
          rc=$?
          set -e
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [[ "$rc" -ge 2 ]]; then
            echo "::error::Uma ou mais verificações não puderam ser concluídas"
            exit "$rc"
          fi
      - name: Abrir, atualizar ou fechar a issue de acompanhamento
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.check.outputs.rc }}
          TITLE: "Catálogo com itens quebrados"
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [[ "$RC" == "1" ]]; then
            {
              echo "Verificação diária de \`scripts/check-catalog.py --remote\` ($(date -u +%F))."
              echo
              cat report.md
              echo
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > body.md
            if [[ -n "$number" ]]; then
              gh issue edit "$number" --body-file body.md
            else
              gh issue create --title "$TITLE" --body-file body.md
            fi
          elif [[ -n "$number" ]]; then
            gh issue close "$number" --comment "Todos os itens do catálogo voltaram a funcionar."
          fi
